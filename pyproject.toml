[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "escape-fel"
dynamic = ["version"]
description = "Event Synchronous Categorisation And Processing Environment — event-based data framework for free-electron lasers"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Henrik Lemke", email = "h.t.lemke@gmail.com" }]
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "dask[array,dataframe]",
    "h5py",
    "zarr",
    "hickle",
    "tqdm",
    "rich",
    "matplotlib",
    "pandas",
    "adjustText",
    "ipywidgets",
    "ipython",
    "lazy-object-proxy",
    "distributed",
    "datastorage",
    "oschmod",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
# escape.wavefront can use scikit-image for a wider unwrapped dynamic range;
# it degrades gracefully (no unwrap) if absent.
wavefront = ["scikit-image"]
# nfigure/StackViewer/etc.'s detached=True shows plots/widgets in a
# JupyterLab Sidecar panel instead of inline; degrades to a clear
# ImportError (not silent fallback) if absent.
sidecar = ["sidecar"]
# escape.fit_gui attaches an interactive lmfit fitting panel to a matplotlib
# Axes; raises a clear ImportError (not silent fallback) if absent.
fit = ["lmfit"]

[project.urls]
Homepage = "https://github.com/htlemke/escape-fel"
Documentation = "https://escape-fel.readthedocs.io"
Repository = "https://github.com/htlemke/escape-fel"
Issues = "https://github.com/htlemke/escape-fel/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["escape*"]

[tool.setuptools.package-data]
# bundle the EXAFS demo dataset (Cu foil, APS 13ID; from xraylarch examples)
"escape.exafs" = ["data/*.xmu"]

[tool.setuptools_scm]
# version is derived automatically from git tags: v0.1.0 -> 0.1.0
